name: visionbox

# Nota (2026-10-13): Redis/RabbitMQ/MinIO REMOVIDOS — nenhum uso no código hoje
# (outbox é 100% banco; anexos em storage local). Re-adicionar quando a camada
# de eventos (publisher/listener Rabbit) for implementada.
services:
  postgres:
    image: postgres:15-alpine
    container_name: visionbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: visionbox
      POSTGRES_USER: visionbox
      POSTGRES_PASSWORD: visionbox
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U visionbox -d visionbox" ]
      interval: 5s
      timeout: 2s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionbox-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,flowbox
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/visionbox
      SPRING_DATASOURCE_USERNAME: visionbox
      SPRING_DATASOURCE_PASSWORD: visionbox
      VISIONBOX_JWT_SECRET: ${JWT_SECRET:-vb_prod_jwt_secret_2026_secured_key_32chars}
      VISIONBOX_CRYPTO_KEK_HEX: ${CRYPTO_KEK_HEX:-c8f3b6127d49e1a85b032c74d9e1f568c8f3b6127d49e1a85b032c74d9e1f568}
      VISIONBOX_CRYPTO_HMAC_PEPPER: ${CRYPTO_HMAC_PEPPER:-vb_prod_pepper_secure_hash_hmac_2026}
      VISIONBOX_LAB_PORTAL_TOKEN_SECRET: ${VISIONBOX_LAB_PORTAL_TOKEN_SECRET:-vb_prod_lab_token_portal_secret_32chars}
      VISIONBOX_AUTH_PUBLIC_REGISTER_ENABLED: "false"
      VISIONBOX_FISCAL_FLOWBOX_URL: ${VISIONBOX_FISCAL_FLOWBOX_URL:-http://flowbox:8085}
      VISIONBOX_FISCAL_FLOWBOX_API_KEY: ${VISIONBOX_FISCAL_FLOWBOX_API_KEY:-fb_Hc85I10tScmYD73nDJfVGkuhZU1Vsu9XKYO9d0Cd5tk}
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      VISIONBOX_STORAGE_UPLOAD_DIR: /data/uploads
    volumes:
      - uploaddata:/data/uploads
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: visionbox-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: visionbox-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  pgdata:
  uploaddata:
