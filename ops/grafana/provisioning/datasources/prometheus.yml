# VisionBox — Datasource Prometheus provisionado para o Grafana.
# Referenciado nos dashboards via uid "prometheus".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 30s