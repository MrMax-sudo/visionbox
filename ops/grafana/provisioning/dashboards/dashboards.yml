# VisionBox — Provisionamento de dashboards (pasta "VisionBox", hot-reload 30s).
apiVersion: 1

providers:
  - name: visionbox
    orgId: 1
    folder: VisionBox
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false