name: visionbox-dev
# docker compose -f docker-compose.dev.yml up -d  → só Postgres (único serviço exigido pelo app hoje)
# App:            docker compose -f docker-compose.dev.yml --profile app up -d
# Observabilidade: docker compose -f docker-compose.dev.yml --profile observability up -d
# Validado via: docker compose -f docker-compose.dev.yml config
#
# Nota (2026-10-13): Redis/RabbitMQ/MinIO REMOVIDOS — nenhum uso no código
# (grep: zero RedisTemplate/@Cacheable/RabbitTemplate/@RabbitListener; anexos em
# storage local, não S3). O outbox é 100% banco (tabela outbox_message). As
# configs spring.data.redis/rabbitmq seguem no application.yml como preparo
# (conexões lazy, app boota sem os serviços). Re-adicionar quando a camada de
# eventos (publisher/listener) for implementada.
# Nota reuse Testcontainers: este compose é para dev local (porta 5432 fixa).
# Testcontainers postgres:15-alpine com withReuse(true) cria container SEPARADO via Ryuk
# (porta aleatória, label org.testcontainers.reuse), não conflita com este PG.
# Em CI Linux runner, este compose é opcional para mvn verify -Pintegration, mas
# deixamos `up -d postgres` no CI para testes que usam localhost.
services:
  postgres:
    image: postgres:15-alpine
    container_name: visionbox-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionbox}
      POSTGRES_USER: ${POSTGRES_USER:-visionbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionbox_dev_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionbox} -d ${POSTGRES_DB:-visionbox}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: postgres -c shared_buffers=256MB -c max_connections=200

  # App backend completo (opt-in): docker compose -f docker-compose.dev.yml --profile app up -d
  # Sobe depois de PG healthy (Dockerfile já traz HEALTHCHECK Java puro).
  # Perfil default (sem SPRING_PROFILES_ACTIVE): Flyway migra/valida no boot —
  # alinhado ao P1 aplicado (2026-10-13); o antigo perfil dev usava
  # ddl-auto: create + flyway off, caminho obsoleto.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionbox-app-dev
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visionbox}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-visionbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-visionbox_dev_2026}
    ports:
      - "${APP_PORT:-8080}:8080"

  # Observabilidade (opt-in): docker compose -f docker-compose.dev.yml --profile observability up -d
  # Prometheus coleta /actuator/prometheus; Grafana provisiona datasource + dashboards (ops/).
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: visionbox-prometheus-dev
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata-dev:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: visionbox-grafana-dev
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sla-lab.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata-dev:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata-dev:
  prometheusdata-dev:
  grafanadata-dev:
