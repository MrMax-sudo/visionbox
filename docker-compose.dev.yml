name: visionbox-dev
# docker compose -f docker-compose.dev.yml up -d  → PG/Redis/Rabbit/MinIO (AGENTS.md §8)
# App:            docker compose -f docker-compose.dev.yml --profile app up -d
# Observabilidade: docker compose -f docker-compose.dev.yml --profile observability up -d
# Validado via: docker compose -f docker-compose.dev.yml config
# Nota reuse Testcontainers: este compose é para dev local (porta 5432 fixa).
# Testcontainers postgres:15-alpine com withReuse(true) cria container SEPARADO via Ryuk
# (porta aleatória, label org.testcontainers.reuse), não conflita com este PG.
# Em CI Linux runner, este compose é opcional para mvn verify -Pintegration, mas
# deixamos `up -d postgres redis rabbitmq minio` no CI para testes que usam localhost.
services:
  postgres:
    image: postgres:15-alpine
    container_name: visionbox-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionbox}
      POSTGRES_USER: ${POSTGRES_USER:-visionbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionbox_dev_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionbox} -d ${POSTGRES_DB:-visionbox}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: postgres -c shared_buffers=256MB -c max_connections=200

  redis:
    image: redis:7-alpine
    container_name: visionbox-redis-dev
    restart: unless-stopped
    # Senha alinhada ao default do app (application.yml: SPRING_DATA_REDIS_PASSWORD:redis_dev_2026)
    # Sem requirepass o app envia AUTH e o Redis nega ("no password is set") — health DOWN.
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_dev_2026} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: visionbox-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-visionbox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-visionbox_dev_2026}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: visionbox-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionbox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visionbox123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # App backend completo (opt-in): docker compose -f docker-compose.dev.yml --profile app up -d
  # Sobe só depois de PG/Redis/Rabbit/MinIO healthy (Dockerfile já traz HEALTHCHECK Java puro).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionbox-app-dev
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visionbox}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-visionbox}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-visionbox_dev_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_2026}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-visionbox}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-visionbox_dev_2026}
      SPRING_RABBITMQ_VIRTUAL_HOST: /
      VISIONBOX_S3_ENDPOINT: http://minio:9000
      VISIONBOX_S3_BUCKET: ${VISIONBOX_S3_BUCKET:-visionbox-receitas}
    ports:
      - "${APP_PORT:-8080}:8080"

  # Observabilidade (opt-in): docker compose -f docker-compose.dev.yml --profile observability up -d
  # Prometheus coleta /actuator/prometheus; Grafana provisiona datasource + dashboards (ops/).
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: visionbox-prometheus-dev
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata-dev:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: visionbox-grafana-dev
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sla-lab.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata-dev:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata-dev:
  prometheusdata-dev:
  grafanadata-dev: