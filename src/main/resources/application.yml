spring:
  application:
    name: visionbox-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visionbox}
    username: ${SPRING_DATASOURCE_USERNAME:visionbox}
    password: ${SPRING_DATASOURCE_PASSWORD:visionbox_dev_2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.time_zone: UTC
        default_schema: public
        # @TenantId habilita filtro automático por loja_id; RLS é segunda barreira
        filter.default_auto_enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis_dev_2026}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:visionbox}
    password: ${SPRING_RABBITMQ_PASSWORD:visionbox_dev_2026}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

visionbox:
  auth:
    public-register-enabled: true
  jwt:
    secret: ${VISIONBOX_JWT_SECRET:dev_jwt_secret_change_in_prod_32chars_min_dev_jwt_secret_change}
    expiration-minutes: ${VISIONBOX_JWT_EXPIRATION_MINUTES:15}
    refresh-days: ${VISIONBOX_JWT_REFRESH_DAYS:7}
  crypto:
    kek-hex: ${VISIONBOX_CRYPTO_KEK_HEX:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
    hmac-pepper: ${VISIONBOX_CRYPTO_HMAC_PEPPER:dev_hmac_pepper_change_in_prod}
  idempotency:
    ttl-hours: 24
  outbox:
    poll-interval-ms: 5000
    max-retries: 10
  crm:
    whatsapp:
      enabled: ${VISIONBOX_WHATSAPP_ENABLED:true}
      provider: ${VISIONBOX_WHATSAPP_PROVIDER:MOCK}
      timeout: ${VISIONBOX_WHATSAPP_TIMEOUT:5s}
      poll-interval-ms: ${VISIONBOX_WHATSAPP_POLL_INTERVAL_MS:5000}
      retry-initial-delay: ${VISIONBOX_WHATSAPP_RETRY_INITIAL_DELAY:30s}
      max-retries: ${VISIONBOX_WHATSAPP_MAX_RETRIES:5}
      circuit-failure-threshold: ${VISIONBOX_WHATSAPP_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-duration: ${VISIONBOX_WHATSAPP_CIRCUIT_OPEN_DURATION:1m}
      base-url: ${VISIONBOX_WHATSAPP_BASE_URL:}
      instance-id: ${VISIONBOX_WHATSAPP_INSTANCE_ID:}
      fallback-to-mock: ${VISIONBOX_WHATSAPP_FALLBACK_TO_MOCK:true}
  s3:
    bucket: ${VISIONBOX_S3_BUCKET:visionbox-receitas}
    endpoint: ${VISIONBOX_S3_ENDPOINT:http://localhost:9000}
    region: ${VISIONBOX_S3_REGION:us-east-1}

logging:
  level:
    com.visionbox: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{loja_id}] %logger{36} - %msg%n"
