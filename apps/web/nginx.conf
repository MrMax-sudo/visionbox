server {
    listen 80 default_server;
    server_name opticanacional.techboxbr.app.br visionbox.techboxbr.app.br localhost _;

    # Gzip para performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Resolver DNS do Docker: re-resolve 'app' (IP muda quando o container é recriado no deploy)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy para API Spring Boot
    location /api/ {
        set $api_upstream http://app:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Service Worker sempre revalidado — atualização do PWA não pode ficar
    # presa no cache de 30d do bloco de assets estáticos abaixo.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Frontend SPA React (HTML5 History API)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache de assets estáticos com hash
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
