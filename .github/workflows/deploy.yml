name: Deploy to VPS

on:
  # Deploy direto automatizado via script local: .\deploy.ps1 (SSH direto na VPS)
  # Disparo manual via GitHub Actions caso necessario:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy VisionBox na VPS
    runs-on: self-hosted
    steps:
      - name: Executar Deploy Local na VPS
        run: |
          echo "=== Iniciando Deploy do VisionBox ==="
          cd /home/mrmax/PROJETOS/VisionBox
          echo "Puxando atualizações do GitHub..."
          git pull origin main
          echo "Reconstruindo e iniciando containers..."
          docker compose up -d --build app web
          echo "Limpando imagens antigas..."
          docker image prune -f
          echo "=== Deploy concluído com sucesso! ==="
          docker compose ps
