name: CI VisionBox

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate compose
        run: docker compose -f docker-compose.dev.yml config
      - name: Up infra
        run: docker compose -f docker-compose.dev.yml up -d postgres redis rabbitmq minio && sleep 10 && docker compose -f docker-compose.dev.yml ps
      - name: Flyway validate
        run: mvn flyway:validate -Dflyway.url=jdbc:postgresql://localhost:5432/visionbox -Dflyway.user=visionbox -Dflyway.password=visionbox
      - name: Unit tests
        run: mvn test -Punit-only
      - name: Integration tests
        run: mvn verify -Pintegration -Dtestcontainers.reuse.enable=true -DTESTCONTAINERS_REUSE_ENABLE=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire
          path: target/surefire-reports
      - name: Down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  build-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/techboxbr/visionbox
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/techboxbr/visionbox:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
