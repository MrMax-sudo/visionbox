name: CI VisionBox

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate compose
        run: docker compose -f docker-compose.dev.yml config
      - name: Up infra
        run: docker compose -f docker-compose.dev.yml up -d postgres redis rabbitmq minio && sleep 10 && docker compose -f docker-compose.dev.yml ps
      - name: Flyway validate
        run: mvn flyway:validate -Dflyway.url=jdbc:postgresql://localhost:5432/visionbox -Dflyway.user=visionbox -Dflyway.password=visionbox
      - name: Unit tests
        run: mvn test -Punit-only
      - name: Integration tests
        run: mvn verify -Pintegration -Dtestcontainers.reuse.enable=true -DTESTCONTAINERS_REUSE_ENABLE=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire
          path: target/surefire-reports
      - name: Down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # Validação do schema em PostgreSQL 15 REAL (postgres:15-alpine) — serviço isolado,
  # sem depender de credenciais de compose/.env. migrate antes do validate garante que
  # "versões resolvidas mas não aplicadas" não falhem o job.
  flyway-validate:
    name: Flyway migrate+validate (PG 15)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: visionbox
          POSTGRES_USER: visionbox
          POSTGRES_PASSWORD: visionbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visionbox -d visionbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Flyway migrate + validate
        run: mvn -B flyway:migrate flyway:validate -Dflyway.url=jdbc:postgresql://localhost:5432/visionbox -Dflyway.user=visionbox -Dflyway.password=visionbox -Dflyway.locations=filesystem:src/main/resources/db/migration

  # Build do frontend (tsc + vite) + auditoria de acessibilidade com axe.
  # axe começa como baseline não-bloqueante (continue-on-error); promover a bloqueante
  # quando o rollup de violações zerar (docs/PENDENCIAS).
  web-build:
    name: Web build + axe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Serve preview + axe a11y
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:4173/ >/dev/null 2>&1 || exit 1
          npx --yes @axe-core/cli http://localhost:4173 --exit
        continue-on-error: true

  build-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/techboxbr/visionbox
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/techboxbr/visionbox:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
